<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>護法會報到人數看板</title>
<style>
  /*
   * ============================================================
   * 檔案：現場報到人數看板（大螢幕顯示用，模組4附屬頁面）
   * 版本：v1.3（2026-09-30，法師訪談決議改成索引輪播＋連續捲動）
   * 版本歷程：
   *   v1.3（2026-09-30）：
   *     (1)「報到進度總覽」改成索引輪播：固定同一個頁面、不換網址，
   *         在卡片內部用「往上滾動」的位移動畫，於「圓餅圖」與
   *         「各組報到統計表」兩頁之間每 3 分鐘自動切換一次，並在
   *         下方顯示頁面指示點（●表示目前頁）。
   *     (2)「最近報到」改成連續向上捲動的跑馬燈效果（項目較多、
   *         清單容器裝不下時才捲動），取代原本每 5 秒整批重繪、
   *         靜態列出的方式，畫面看起來更像跑馬燈持續滾動更新。
   *     (3) 各組報到統計表也改成表頭固定、內容連續向上捲動（做法
   *         跟「最近報到」一致），組別數量較多、切到第二頁時裝不下
   *         的部分會自動捲動輪流呈現，不會被截斷看不到。
   *   v1.2（2026-09-30）：
   *     (1) 版面比例調整：左邊「報到進度總覽」與右邊「最近報到」
   *         欄寬比例由 1.3:1 改成 2:1，報到進度區塊佔畫面約 2/3，
   *         最近報到區塊佔約 1/3。
   *     (2)「最近報到」每一筆原本姓名（法名）＋組別＋報到時間排在
   *         同一行（左右對齊），姓名較長時容易擠在一起換行；改成
   *         上下兩行：第一行「姓名（法名） 組別」、第二行「報到
   *         時間」，讓資訊分層更清楚。
   *   v1.1（2026-09-30）：
   *     (1) 深色底（--color-bg 原為 #2E2418 深咖啡近黑）投影機投影
   *         出來不明顯、對比不足，改成淺色系（米白底＋深咖啡文字），
   *         跟系統其他頁面的配色一致，投影機／電視顯示對比更清楚。
   *     (2) 總計進度原本是「大數字百分比＋長條進度條」，改成圓餅圖
   *         （CSS conic-gradient 實作的甜甜圈圖，不需要額外圖表
   *         函式庫），百分比文字放在圓餅圖正中央，遠距離觀看更直覺、
   *         更適合大螢幕呈現。
   *   v1.0（2026-09-30，法師訪談決議新增）：初版，深色底＋長條進度條。
   * 說明：
   *   給活動現場大螢幕（電視／投影幕）使用的公開看板，不需要
   *   登入，網址參數跟現場報到頁 checkin.html 相同：
   *     checkin-dashboard.html?temple=A&session=1025
   *   內容比照 checkin.html 的「報到進度總覽」卡片（總計＋依組別
   *   統計，含報到率），並新增「最近報到名單」，隨現場報到情況
   *   每 5 秒自動刷新一次，不需要人工操作或重新整理頁面。
   *   本頁純顯示、無任何輸入或掃描功能，跟 checkin.html（操作
   *   人員用來執行報到）分成兩個獨立頁面，避免大螢幕上出現不會
   *   用到的輸入框或相機畫面。
   *   2026-09-30 訪談決議：現場工作人員提醒，最近報到名單直接
   *   公開顯示姓名在大螢幕上，現場人員應留意螢幕擺放位置與觀看
   *   對象，若日後需要調整揭露範圍（例如只顯示法名不顯示姓名、
   *   或完全不顯示名單只留人數統計），可再訪談調整，後端 API
   *   （查詢報到進度統計）已把「最近報到」設計成獨立欄位，前端
   *   要拿掉這塊顯示不需要改動後端。
   * ============================================================
   */
  :root {
    /* 【v1.1 調整】改成淺色系，投影機／電視投影對比較清楚，跟系統
       其他頁面（登入頁、報到頁等）的米白＋深咖啡配色維持一致 */
    --color-bg: #FBF8F1;
    --color-panel-bg: #FFFFFF;
    --color-panel-border: #E4DCC8;
    --color-title: #2E2418;
    --color-subtitle: #8A7B63;
    --color-accent: #6B4226;
    --color-accent-bar-bg: #EDE6D6;
    --color-success: #3F6B2E;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "微軟正黑體", "PMingLiU", sans-serif;
    background: var(--color-bg);
    color: var(--color-title);
    margin: 0;
    padding: 28px 40px;
    min-height: 100vh;
  }
  #loadingNotice {
    text-align: center;
    color: var(--color-subtitle);
    font-size: 28px;
    padding: 80px 0;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 22px;
  }
  .header img {
    height: 64px;
    width: auto;
  }
  .header .titles h1 {
    margin: 0;
    font-size: 30px;
    color: var(--color-title);
  }
  .header .titles .session-line {
    margin-top: 4px;
    font-size: 18px;
    color: var(--color-subtitle);
  }
  .header .titles .announcement {
    margin-top: 2px;
    font-size: 15px;
    color: var(--color-subtitle);
  }
  .status-ended {
    margin-left: auto;
    background: #B3372C;
    color: #fff;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 16px;
  }

  /* 【2026-09-30 法師訪談決議調整】版面比例改成左邊「報到進度總覽」
     佔 2/3、右邊「最近報到」佔 1/3（原本是 1.3:1，比較接近對半） */
  .layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--color-panel-bg);
    border: 1px solid var(--color-panel-border);
    border-radius: 16px;
    padding: 24px 28px;
  }
  .panel h2 {
    margin: 0 0 16px 0;
    font-size: 20px;
    color: var(--color-subtitle);
    font-weight: normal;
    letter-spacing: 1px;
  }
  /* 【2026-09-30 法師訪談決議調整】報到進度總覽卡片內容固定高度
     （輪播 260px＋指示點），但因為跟右邊最近報到面板同一列，格線
     版面（.layout 用 grid）預設會把兩個 .panel 拉成一樣高，導致
     卡片內容下方留下一大塊空白；改用 flex 讓 .progress-body 在
     多出來的高度中垂直置中，畫面比較平衡。 */
  .panel-progress {
    display: flex;
    flex-direction: column;
  }
  .progress-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* 【v1.1 新增】總計進度改用圓餅圖（甜甜圈圖）呈現，比大數字＋
     長條進度條更適合遠距離觀看，一眼就能看出報到比例。用純 CSS
     conic-gradient 畫圓餅圖，不需要載入額外的圖表函式庫；中間挖空
     放百分比文字（.pie-center），JS 每次更新只需要改變
     .pie-chart 的 background 漸層角度即可，見「更新報到進度看板」。 */
  .total-row {
    display: flex;
    align-items: center;
    gap: 32px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .pie-chart {
    position: relative;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    flex-shrink: 0;
    background: conic-gradient(var(--color-accent-bar-bg) 0% 100%);
  }
  .pie-chart::before {
    content: "";
    position: absolute;
    inset: 20px;
    background: var(--color-panel-bg);
    border-radius: 50%;
  }
  .pie-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .pie-percent {
    font-size: 44px;
    font-weight: bold;
    color: var(--color-accent);
    line-height: 1;
  }
  .pie-label {
    font-size: 13px;
    color: var(--color-subtitle);
    margin-top: 4px;
  }
  .total-count {
    font-size: 24px;
    color: var(--color-title);
    font-weight: bold;
  }

  /* 【2026-09-30 法師訪談決議新增】報到進度總覽改成「索引輪播」：
     維持單一頁面、不換網址，固定高度的視窗（.progress-carousel）
     裡面放兩張「頁面」（.progress-slide）：第一頁圓餅圖、第二頁
     各組報到統計表，每隔一段時間用「往上滾動」的位移動畫換到下
     一頁，並在下方用小圓點（.carousel-dots）標示目前在第幾頁。 */
  .progress-carousel {
    position: relative;
    height: 260px;
    overflow: hidden;
  }
  .progress-track {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    transition: transform 0.6s ease;
  }
  .progress-slide {
    height: 260px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
  }
  .progress-slide.slide-table {
    align-items: stretch;
    flex-direction: column;
  }
  /* 【2026-09-30 法師訪談決議新增】各組報到統計改成「表頭固定、
     內容連續向上捲動」：組別數量較多、260px 高度裝不下時，內容
     會自動往上捲動輪流呈現，做法跟「最近報到」的跑馬燈一致（見
     JS「重繪各組統計表格」），表頭（組別／已報到／總人數／
     報到率）固定不跟著捲動。 */
  .group-table-header {
    display: flex;
    padding: 0 4px 10px 4px;
    border-bottom: 1px solid var(--color-panel-border);
    color: var(--color-subtitle);
    font-size: 15px;
    flex-shrink: 0;
  }
  .group-table-header > div {
    flex: 1;
  }
  .group-scroll-wrap {
    flex: 1;
    overflow: hidden;
  }
  .group-scroll {
    display: flex;
    flex-direction: column;
  }
  .group-row {
    display: flex;
    padding: 10px 4px;
    border-bottom: 1px solid var(--color-panel-border);
    font-size: 18px;
    flex-shrink: 0;
  }
  .group-row > div {
    flex: 1;
  }
  .group-row .rate {
    color: var(--color-accent);
    font-weight: bold;
  }
  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }
  .carousel-dots .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--color-accent-bar-bg);
    transition: background 0.3s ease;
  }
  .carousel-dots .dot.active {
    background: var(--color-accent);
  }


  /* 【2026-09-30 法師訪談決議調整】最近報到名單改成「連續向上捲動」
     的跑馬燈效果：外層 .recent-list-wrap 固定高度、裁掉超出範圍的
     內容；內層 .recent-list 把名單複製一份接在後面，用 CSS
     animation 讓內容持續往上位移，捲到一半（第一份名單捲完）時
     視覺上剛好無縫接上複製的第二份，達成不間斷捲動的效果，細節
     見 JS「重繪最近報到名單」。項目不多、清單容器裝得下時則不
     捲動，直接靜態顯示即可。 */
  .recent-list-wrap {
    max-height: 640px;
    overflow: hidden;
  }
  .recent-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .recent-item {
    /* 【2026-09-30 法師訪談決議調整】改成上下兩行：
       第一行「姓名（法名） 組別」、第二行「報到時間」，
       避免姓名+法名較長時跟組別/時間擠在同一行造成換行、版面混亂 */
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    /* 【v1.1 調整】淺色系改用比白色面板稍深一階的米色底，
       避免跟 .panel 的白底混在一起分不清每一筆的區塊界線 */
    background: var(--color-accent-bar-bg);
    border: 1px solid var(--color-panel-border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 19px;
    animation: fadeIn 0.5s ease;
  }
  .recent-item .name {
    color: var(--color-title);
    font-weight: bold;
  }
  .recent-item .group {
    color: var(--color-subtitle);
    font-size: 15px;
    margin-left: 8px;
  }
  .recent-item .time {
    color: var(--color-success);
    font-size: 15px;
    white-space: nowrap;
    margin-top: 4px;
  }
  .empty-hint {
    color: var(--color-subtitle);
    font-size: 16px;
    padding: 10px 0;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes scrollUp {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
  }
</style>
</head>
<body>

<div id="loadingNotice">載入中，請稍候...</div>

<div id="mainContent" style="display:none;">

  <div class="header">
    <img src="logo-icon.jpg" alt="護法會雲端系統">
    <div class="titles">
      <h1 id="sessionNameShow"></h1>
      <div class="session-line">報到人數看板</div>
      <div class="announcement" id="announcementShow"></div>
    </div>
    <div id="endedBadge" class="status-ended" style="display:none;">本場次報到已結束</div>
  </div>

  <div class="layout">
    <div class="panel panel-progress">
      <h2>報到進度總覽</h2>
      <div class="progress-body">
        <div class="progress-carousel" id="progressCarousel">
          <div class="progress-track" id="progressTrack">
            <div class="progress-slide">
              <div class="total-row">
                <div class="pie-chart" id="pieChart">
                  <div class="pie-center">
                    <div class="pie-percent" id="totalPercentShow">0%</div>
                    <div class="pie-label">已報到</div>
                  </div>
                </div>
                <div class="total-count" id="totalCountShow">已報到 0 / 0 人</div>
              </div>
            </div>
            <div class="progress-slide slide-table">
              <div class="group-table-header">
                <div>組別</div><div>已報到</div><div>總人數</div><div>報到率</div>
              </div>
              <div class="group-scroll-wrap" id="groupScrollWrap">
                <div class="group-scroll" id="groupScroll"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="carousel-dots" id="progressDots">
          <span class="dot active"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>最近報到</h2>
      <div class="recent-list-wrap" id="recentListWrap">
        <div class="recent-list" id="recentList">
          <div class="empty-hint">尚無報到紀錄</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="config.js"></script>
<script>
/**
 * ============================================================
 * 現場報到人數看板－前端邏輯
 * 版本：v1.0（2026-09-30）
 * ============================================================
 */

/**
 * ------------------------------------------------------------
 * 函式：取得網址參數
 * 版本：v1.0（2026-09-30，沿用 checkin.html 同名函式的做法）
 * 用途：從目前網址的查詢字串中取出指定參數值。
 * 參數：
 *   strKey - 參數名稱
 * 回傳：str 參數值，找不到時回傳空字串
 * ------------------------------------------------------------
 */
function 取得網址參數(strKey) {
  const params = new URLSearchParams(window.location.search);
  return params.get(strKey) || "";
}

/**
 * ------------------------------------------------------------
 * 函式：更新報到進度看板
 * 版本：v1.0（2026-09-30）
 * 用途：呼叫後端「查詢報到進度統計」action（與 checkin.html 共用
 *       同一支 API），取得總計、依組別統計、最近報到名單，重繪
 *       畫面上所有動態內容。每 5 秒自動呼叫一次，讓大螢幕不需要
 *       人工操作就能持續顯示最新報到狀況。
 * 參數：無（直接從網址參數讀取精舍代碼、場次代碼）
 * 回傳：無
 * ------------------------------------------------------------
 */
async function 更新報到進度看板() {
  try {
    const objResult = await 呼叫後端API({
      system: "現場報到",
      action: "查詢報到進度統計",
      精舍代碼: 取得網址參數("temple"),
      場次代碼: 取得網址參數("session")
    });

    if (!objResult.成功) {
      return; // 看板顯示失敗時安靜略過，等下一次 5 秒後重試，不打斷畫面
    }

    const int百分比 = objResult.總人數 > 0
      ? Math.round((objResult.已報到人數 / objResult.總人數) * 100)
      : 0;

    document.getElementById("totalPercentShow").textContent = int百分比 + "%";
    document.getElementById("totalCountShow").textContent =
      "已報到 " + objResult.已報到人數 + " / " + objResult.總人數 + " 人";

    // 【v1.1 新增】用 conic-gradient 畫圓餅圖：0% 到「百分比」這段
    // 用強調色（已報到），剩下的用淺底色（未報到），只要改這一行
    // 的漸層百分比就能更新整個圓餅圖，不需要額外圖表函式庫
    document.getElementById("pieChart").style.background =
      "conic-gradient(var(--color-accent) 0% " + int百分比 + "%, var(--color-accent-bar-bg) " + int百分比 + "% 100%)";

    重繪各組統計表格(objResult.依組別統計 || []);
    重繪最近報到名單(objResult.最近報到 || []);
  } catch (錯誤) {
    console.error("更新報到進度看板時發生錯誤：", 錯誤);
  }
}

/**
 * 全域變數：str上次各組統計內容Key
 * 用途：跟「最近報到」一樣的做法，內容沒變就不重建、不重啟捲動
 *       動畫，避免每 5 秒刷新打斷捲動的連續感。
 */
let str上次各組統計內容Key = "";

/**
 * ------------------------------------------------------------
 * 函式：組出各組統計一列元素
 * 版本：v1.0（2026-09-30）
 * 用途：把單一組的統計資料組成 .group-row 的 DOM 元素，抽成獨立
 *       函式是因為「連續向上捲動」需要把同一份清單畫兩次（原始＋
 *       複製一份接在後面）。
 * 參數：
 *   obj這一組 - { 組別, 已報到人數, 總人數 }
 * 回傳：DOM 元素（.group-row）
 * ------------------------------------------------------------
 */
function 組出各組統計一列元素(obj這一組) {
  const int組百分比 = obj這一組.總人數 > 0
    ? Math.round((obj這一組.已報到人數 / obj這一組.總人數) * 100)
    : 0;
  const elRow = document.createElement("div");
  elRow.className = "group-row";
  elRow.innerHTML = "<div></div><div></div><div></div><div class='rate'></div>";
  elRow.children[0].textContent = obj這一組.組別;
  elRow.children[1].textContent = obj這一組.已報到人數;
  elRow.children[2].textContent = obj這一組.總人數;
  elRow.children[3].textContent = int組百分比 + "%";
  return elRow;
}

/**
 * ------------------------------------------------------------
 * 函式：重繪各組統計表格
 * 版本：v1.1（2026-09-30，改成表頭固定＋內容連續向上捲動）
 * 版本歷程：
 *   v1.1（2026-09-30）：組別較多、260px 高度裝不下時，內容改成
 *     跟「最近報到」一樣的連續向上捲動跑馬燈效果（複製一份接在
 *     後面、CSS animation 無縫循環），表頭固定不跟著捲動；內容
 *     沒變化時不重建、不重啟動畫，維持捲動連續不中斷。組別不多
 *     時維持靜態顯示，不需要捲動。
 *   v1.0（2026-09-30）：初版，用 HTML table 靜態列出。
 * 用途：把「依組別統計」陣列畫成清單，並計算各組報到率
 *       （已報到人數÷總人數，前端計算，不需要後端額外回傳）。
 * 參數：
 *   arr依組別統計 - { 組別, 已報到人數, 總人數 } 物件陣列
 * 回傳：無
 * ------------------------------------------------------------
 */
function 重繪各組統計表格(arr依組別統計) {
  const elScroll = document.getElementById("groupScroll");

  if (!arr依組別統計 || arr依組別統計.length === 0) {
    elScroll.style.animation = "none";
    elScroll.innerHTML = "";
    str上次各組統計內容Key = "";
    return;
  }

  const str這次內容Key = arr依組別統計
    .map(function (o) { return o.組別 + "," + o.已報到人數 + "," + o.總人數; })
    .join("|");
  if (str這次內容Key === str上次各組統計內容Key) {
    return;
  }
  str上次各組統計內容Key = str這次內容Key;

  elScroll.style.animation = "none";
  elScroll.innerHTML = "";
  arr依組別統計.forEach(function (obj這一組) {
    elScroll.appendChild(組出各組統計一列元素(obj這一組));
  });

  // 組別數量門檻：清單容器裝得下就不用捲動，直接靜態顯示即可
  const bool需要捲動 = arr依組別統計.length > 4;
  if (bool需要捲動) {
    arr依組別統計.forEach(function (obj這一組) {
      elScroll.appendChild(組出各組統計一列元素(obj這一組));
    });

    void elScroll.offsetHeight; // 強制重新計算版面，確保動畫從頭開始播放

    const int捲動速度PxPerSec = 24; // 各組統計文字較少，捲動速度稍慢一點方便閱讀
    const num一份高度 = elScroll.scrollHeight / 2;
    const num動畫秒數 = num一份高度 / int捲動速度PxPerSec;
    elScroll.style.animation = "scrollUp " + num動畫秒數 + "s linear infinite";
  }
}

/**
 * ------------------------------------------------------------
 * 全域變數：str上次最近報到內容Key
 * 用途：記住上一次「重繪最近報到名單」畫出來的內容，內容沒變就
 *       不重建清單、不重啟捲動動畫，避免每 5 秒刷新時畫面被打斷
 *       重跳一次，讓連續捲動看起來真的是「連續」的。
 * ------------------------------------------------------------
 */
let str上次最近報到內容Key = "";

/**
 * ------------------------------------------------------------
 * 函式：組出最近報到一筆的畫面元素
 * 版本：v1.0（2026-09-30）
 * 用途：把單一筆「最近報到」資料組成 .recent-item 的 DOM 元素，
 *       抽成獨立函式是因為「連續向上捲動」需要把同一份名單畫
 *       兩次（原始＋複製一份接在後面），避免重複寫兩次組字邏輯。
 * 參數：
 *   obj一筆 - { 姓名, 法名, 組別, 報到時間 }
 * 回傳：DOM 元素（.recent-item）
 * ------------------------------------------------------------
 */
function 組出最近報到一筆元素(obj一筆) {
  const elItem = document.createElement("div");
  elItem.className = "recent-item";
  const str姓名法名 = obj一筆.姓名 + (obj一筆.法名 ? "（" + obj一筆.法名 + "）" : "");
  elItem.innerHTML =
    "<span class='line1'><span class='name'></span><span class='group'></span></span>" +
    "<span class='time'></span>";
  elItem.querySelector(".name").textContent = str姓名法名;
  elItem.querySelector(".group").textContent = obj一筆.組別 || "";
  elItem.querySelector(".time").textContent = obj一筆.報到時間 || "";
  return elItem;
}

/**
 * ------------------------------------------------------------
 * 函式：重繪最近報到名單
 * 版本：v1.1（2026-09-30，改成連續向上捲動的跑馬燈效果）
 * 版本歷程：
 *   v1.1（2026-09-30）：原本每次刷新都整份重繪、靜態列出；改成
 *     把名單複製一份接在後面，用 CSS animation 讓內容持續往上
 *     位移，捲完第一份剛好無縫接上複製的第二份，達成不間斷捲動。
 *     項目不多（清單容器裝得下）時不需要捲動，維持靜態顯示。
 *     另外加上內容比對，資料沒變化時不重建清單、不重啟動畫，
 *     避免每 5 秒刷新一次打斷捲動的連續感。
 *   v1.0（2026-09-30）：初版，每次刷新整份重繪、靜態列出。
 * 用途：把後端回傳的「最近報到」陣列（已依報到時間新到舊排序）
 *       畫成清單，最新一筆在最上方，隨現場報到情況持續往上捲動。
 * 參數：
 *   arr最近報到 - { 姓名, 法名, 組別, 報到時間 } 物件陣列
 * 回傳：無
 * ------------------------------------------------------------
 */
function 重繪最近報到名單(arr最近報到) {
  const elList = document.getElementById("recentList");

  if (!arr最近報到 || arr最近報到.length === 0) {
    elList.style.animation = "none";
    elList.innerHTML = "<div class='empty-hint'>尚無報到紀錄</div>";
    str上次最近報到內容Key = "";
    return;
  }

  // 內容跟上次完全相同就不重建、不重啟動畫，讓捲動維持連續不中斷
  const str這次內容Key = arr最近報到
    .map(function (o) { return o.姓名 + "," + o.法名 + "," + o.組別 + "," + o.報到時間; })
    .join("|");
  if (str這次內容Key === str上次最近報到內容Key) {
    return;
  }
  str上次最近報到內容Key = str這次內容Key;

  elList.style.animation = "none";
  elList.innerHTML = "";
  arr最近報到.forEach(function (obj一筆) {
    elList.appendChild(組出最近報到一筆元素(obj一筆));
  });

  // 項目數量門檻：清單容器裝得下就不用捲動，直接靜態顯示即可
  const bool需要捲動 = arr最近報到.length > 4;
  if (bool需要捲動) {
    // 複製一份接在後面，讓捲動到一半（剛好捲完第一份）時無縫接回開頭
    arr最近報到.forEach(function (obj一筆) {
      elList.appendChild(組出最近報到一筆元素(obj一筆));
    });

    void elList.offsetHeight; // 強制重新計算版面，確保動畫從頭開始播放

    const int捲動速度PxPerSec = 32; // 捲動速度：每秒位移的像素數，數字越大捲越快
    const num一份高度 = elList.scrollHeight / 2;
    const num動畫秒數 = num一份高度 / int捲動速度PxPerSec;
    elList.style.animation = "scrollUp " + num動畫秒數 + "s linear infinite";
  }
}

/**
 * 全域變數：int報到進度目前頁數
 * 用途：記錄「報到進度總覽」輪播目前顯示第幾頁（0：圓餅圖，
 *       1：各組報到統計表），供「切換報到進度頁面」判斷位移方向。
 */
let int報到進度目前頁數 = 0;

/**
 * ------------------------------------------------------------
 * 函式：切換報到進度頁面
 * 版本：v1.0（2026-09-30）
 * 用途：把「報到進度總覽」輪播切到指定頁數，用 CSS transform 做
 *       「往上滾動」的位移動畫（而非直接切換／淡入淡出），並同步
 *       更新下方頁面指示點（.dot）的樣式。
 * 參數：
 *   intIndex - 要切到第幾頁（0 或 1）
 * 回傳：無
 * ------------------------------------------------------------
 */
function 切換報到進度頁面(intIndex) {
  int報到進度目前頁數 = intIndex;
  const elCarousel = document.getElementById("progressCarousel");
  const elTrack = document.getElementById("progressTrack");
  const num一頁高度 = elCarousel.clientHeight;
  elTrack.style.transform = "translateY(-" + (intIndex * num一頁高度) + "px)";

  document.querySelectorAll("#progressDots .dot").forEach(function (elDot, intDotIndex) {
    elDot.classList.toggle("active", intDotIndex === intIndex);
  });
}

/**
 * ------------------------------------------------------------
 * 函式：啟動報到進度輪播
 * 版本：v1.0（2026-09-30，法師訪談決議：每 3 分鐘自動切換一次）
 * 用途：每隔固定時間，把「報到進度總覽」在圓餅圖／各組報到統計表
 *       兩頁之間自動切換一次，讓大螢幕不需要人工操作就能輪流
 *       呈現兩種資訊。畫面固定維持在同一頁（不換網址、不跳頁），
 *       只有這個卡片內部的兩張「頁面」在輪播。
 * 參數：無
 * 回傳：無
 * ------------------------------------------------------------
 */
function 啟動報到進度輪播() {
  const int輪播間隔毫秒 = 3 * 60 * 1000; // 【法師訪談決議】每 3 分鐘切換一次
  setInterval(function () {
    切換報到進度頁面((int報到進度目前頁數 + 1) % 2);
  }, int輪播間隔毫秒);
}

/**
 * ------------------------------------------------------------
 * 函式：初始化頁面
 * 版本：v1.0（2026-09-30）
 * 用途：頁面載入時執行，檢查網址參數是否齊全，呼叫「查詢場次
 *       公開資訊」取得場次名稱與公告文字顯示在頁首，之後啟動
 *       「更新報到進度看板」並每 5 秒自動刷新一次。
 * 參數：無
 * 回傳：無
 * ------------------------------------------------------------
 */
async function 初始化頁面() {
  const str精舍代碼 = 取得網址參數("temple");
  const str場次代碼 = 取得網址參數("session");

  if (!str精舍代碼 || !str場次代碼) {
    document.getElementById("loadingNotice").textContent =
      "網址參數不完整，請確認看板連結是否正確（應包含 ?temple=...&session=...）。";
    return;
  }

  try {
    const objResult = await 呼叫後端API({
      system: "現場報到",
      action: "查詢場次公開資訊",
      精舍代碼: str精舍代碼,
      場次代碼: str場次代碼
    });

    if (!objResult.成功) {
      document.getElementById("loadingNotice").textContent =
        objResult.訊息 || "無法載入場次資訊。";
      return;
    }

    document.getElementById("sessionNameShow").textContent = objResult.場次名稱;
    document.getElementById("announcementShow").textContent = objResult.公告文字 || "";
    if (objResult.狀態 !== "進行中") {
      document.getElementById("endedBadge").style.display = "inline-block";
    }

    document.getElementById("loadingNotice").style.display = "none";
    document.getElementById("mainContent").style.display = "block";

    更新報到進度看板();
    setInterval(更新報到進度看板, 5000);
    啟動報到進度輪播();
  } catch (錯誤) {
    console.error("載入場次公開資訊時發生錯誤：", 錯誤);
    document.getElementById("loadingNotice").textContent = "載入時發生未預期錯誤，請重新整理頁面再試一次。";
  }
}

初始化頁面();
</script>
