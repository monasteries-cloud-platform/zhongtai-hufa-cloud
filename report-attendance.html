<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>護法會雲端系統 - 組長線上出席回報</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /*
   * ============================================================
   * 檔案：組長線上出席回報網頁（Module5「出席回報」）
   * 版本：v1.0（2026-09-22）
   * 版本歷程：
   *   - v1.0（2026-09-22，2026-09-22 訪談確認「確認OK」）：初版。
   * 說明：
   *   組長本人用 Google 帳號登入後（跟「組長線上填寫提報名單」
   *   report-form.html 共用同一套 Google 登入／白名單機制，不需要
   *   另外登錄一次），選擇一個資料組已經建立的出席回報活動，看到
   *   自己組別的完整名單：
   *     - 該學員「負責組別」＝自己組別 → 可以勾選出席／填備註
   *     - 「負責組別」≠自己組別 → 顯示灰色唯讀文字「已由OO組聯絡確認」
   *   整批勾選完後一次按「送出」寫入，對應後端 system:"組長" 新增的
   *   「組長查詢出席活動清單」「組長查詢出席名單」「組長送出出席
   *   回報」三個 action（提報系統_04_組長作業.gs）。
   *
   *   使用方式：資料組在「提報名單資料組操作」頁面卡片六「出席回報
   *   管理」，把本頁面網址加上 ?temple=精舍代碼 分享給組長（例如
   *   report-attendance.html?temple=TEST）。
   * ============================================================
   */
  body {
    font-family: "微軟正黑體", "PMingLiU", sans-serif;
    background: #f4f6f9;
    color: #222;
    margin: 0;
    padding: 24px 16px 60px 16px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  .box {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    padding: 28px 30px;
  }
  h1 { font-size: 19px; color: #1F3864; margin: 0 0 6px 0; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
  }
  .topbar .group-name { color: #2E5395; font-weight: bold; }
  .topbar button {
    background: #888; color: #fff; border: none; border-radius: 6px;
    padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  .topbar button:hover { background: #555; }

  .activity-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .activity-row select {
    padding: 7px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; min-width: 220px;
  }

  .closed-banner {
    background: #fff3cd; color: #7a5b00; border: 1px solid #ffe08a;
    border-radius: 8px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 16px;
  }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { border: 1px solid #e0e0e0; padding: 6px 8px; text-align: left; }
  th { background: #f0f3f8; color: #333; }
  td input[type=text] {
    width: 100%; box-sizing: border-box; padding: 5px 6px;
    border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
  }
  td input[type=checkbox] { transform: scale(1.2); }
  .readonly-note { color: #999; font-style: italic; }

  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  button.action {
    padding: 9px 18px; background: #2E5395; color: #fff; border: none;
    border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  button.action:disabled { background: #99a8c2; cursor: not-allowed; }
  button.action:hover:not(:disabled) { background: #1F3864; }

  .msg { margin-top: 12px; font-size: 13px; min-height: 18px; white-space: pre-line; }
  .msg.error { color: #c00; }
  .msg.success { color: #1a7f37; }
  .msg.info { color: #666; }
  .empty-hint { color: #999; font-size: 13px; padding: 8px 0; }

  #loginArea { text-align: center; padding: 20px 0; }
  #groupSelectArea { text-align: center; padding: 10px 0; }
  #groupSelectArea button {
    margin: 6px; padding: 8px 16px; background: #2E5395; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  #groupSelectArea button:hover { background: #1F3864; }
</style>
</head>
<body>

<div class="wrap">
  <div class="box">
    <h1>組長線上出席回報</h1>
    <div class="sub">請用您登錄在「組長名冊」中的 Google 帳號登入，選擇活動後即可勾選本組出席狀況。</div>

    <!-- 尚未登入：Google 登入畫面 -->
    <div id="loginArea">
      <div id="googleSignInButton"></div>
      <div class="msg" id="msgLogin"></div>
    </div>

    <!-- 已用 Google 帳號驗證通過，但身兼多組別，需要選一組 -->
    <div id="groupSelectArea" style="display:none;">
      <div class="sub">您登錄了多個組別，請選擇本次要回報的組別：</div>
      <div id="groupSelectButtons"></div>
    </div>

    <!-- 已登入，正式作業畫面 -->
    <div id="formArea" style="display:none;">
      <div class="topbar">
        <div>目前組別：<span class="group-name" id="groupNameShow"></span>（<span id="leaderNameShow"></span>）</div>
        <button onclick="處理登出按鈕點擊()">登出</button>
      </div>

      <div class="activity-row">
        活動：
        <select id="selectActivity" onchange="處理活動選擇變更()">
          <option value="">請選擇活動...</option>
        </select>
      </div>

      <div id="attendanceContentArea">
        <div class="empty-hint">請先選擇活動。</div>
      </div>

      <div class="msg" id="msgForm"></div>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script>

// ==================== 【組長登入狀態（跟 report-form.html 共用同一組 key，同一裝置上可以互通）】 ====================

const SESSION_KEY_組長TOKEN = "護法會雲端系統_組長token";
const SESSION_KEY_組長組別 = "護法會雲端系統_組長組別";
const SESSION_KEY_組長姓名 = "護法會雲端系統_組長姓名";

function 取得目前登入組長資訊() {
  const strToken = sessionStorage.getItem(SESSION_KEY_組長TOKEN);
  if (!strToken) { return null; }
  return {
    token: strToken,
    組別: sessionStorage.getItem(SESSION_KEY_組長組別) || "",
    組長姓名: sessionStorage.getItem(SESSION_KEY_組長姓名) || ""
  };
}

function 儲存登入組長資訊(strToken, str組別, str組長姓名) {
  sessionStorage.setItem(SESSION_KEY_組長TOKEN, strToken);
  sessionStorage.setItem(SESSION_KEY_組長組別, str組別 || "");
  sessionStorage.setItem(SESSION_KEY_組長姓名, str組長姓名 || "");
}

function 清除登入組長資訊() {
  sessionStorage.removeItem(SESSION_KEY_組長TOKEN);
  sessionStorage.removeItem(SESSION_KEY_組長組別);
  sessionStorage.removeItem(SESSION_KEY_組長姓名);
}

function 取得網址精舍代碼() {
  const urlParams = new URLSearchParams(window.location.search);
  return (urlParams.get("temple") || "").trim();
}


// ==================== 【共用小工具】 ====================

function 顯示區塊訊息(strMsgElementId, str訊息內容, str樣式) {
  const elMsg = document.getElementById(strMsgElementId);
  elMsg.textContent = str訊息內容;
  elMsg.className = "msg " + str樣式;
}

function 轉義HTML(str原始文字) {
  if (str原始文字 === undefined || str原始文字 === null) return "";
  const div = document.createElement("div");
  div.textContent = String(str原始文字);
  return div.innerHTML;
}

async function 呼叫組長API(str動作, obj額外參數, boolSkipToken) {
  const obj請求內容 = Object.assign({ system: "組長", action: str動作 }, obj額外參數 || {});
  if (!boolSkipToken) {
    const obj登入資訊 = 取得目前登入組長資訊();
    if (!obj登入資訊) {
      顯示登入畫面();
      return { 成功: false, 訊息: "登入狀態已失效，請重新登入。" };
    }
    obj請求內容.token = obj登入資訊.token;
  }
  return await 呼叫後端API(obj請求內容);
}


// ==================== 【Google 登入】 ====================

var str暫存精舍代碼 = "";

function 初始化Google登入() {
  str暫存精舍代碼 = 取得網址精舍代碼();
  if (!str暫存精舍代碼) {
    顯示區塊訊息("msgLogin", "網址缺少精舍代碼（temple 參數），請聯絡資料組確認連結是否正確（例如：...report-attendance.html?temple=精舍代碼）。", "error");
    return;
  }
  if (!GOOGLE_CLIENT_ID_前端 || GOOGLE_CLIENT_ID_前端 === "請填入GoogleOAuthClientId") {
    顯示區塊訊息("msgLogin", "系統尚未完成 Google 登入設定，請聯絡工程人員先申請並填入 Google OAuth Client ID。", "error");
    return;
  }
  if (typeof google === "undefined" || !google.accounts) {
    顯示區塊訊息("msgLogin", "Google 登入元件載入失敗，請確認網路連線後重新整理頁面。", "error");
    return;
  }

  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID_前端,
    callback: 處理Google登入回呼
  });
  google.accounts.id.renderButton(document.getElementById("googleSignInButton"), {
    theme: "outline", size: "large", text: "signin_with", locale: "zh-TW"
  });
}

async function 處理Google登入回呼(objGoogleResponse) {
  顯示區塊訊息("msgLogin", "驗證中，請稍候...", "info");
  try {
    const objResult = await 呼叫組長API("組長Google登入", {
      精舍代碼: str暫存精舍代碼,
      idToken: objGoogleResponse.credential
    }, true);

    if (!objResult.成功) {
      顯示區塊訊息("msgLogin", objResult.訊息 || "登入失敗，請重新嘗試。", "error");
      return;
    }

    if (objResult.需選擇組別) {
      顯示選組別畫面(objResult.預備token, objResult.組別清單);
      return;
    }

    儲存登入組長資訊(objResult.token, objResult.組別, objResult.組長姓名);
    await 顯示表單畫面();
  } catch (錯誤) {
    console.error("Google 登入時發生未預期錯誤：", 錯誤);
    顯示區塊訊息("msgLogin", "系統發生未預期錯誤，請稍後再試或聯絡工程人員。", "error");
  }
}

function 顯示選組別畫面(str預備token, arr組別清單) {
  document.getElementById("loginArea").style.display = "none";
  document.getElementById("groupSelectArea").style.display = "block";
  const elButtons = document.getElementById("groupSelectButtons");
  elButtons.innerHTML = "";
  arr組別清單.forEach(function (str組別) {
    const btn = document.createElement("button");
    btn.textContent = str組別;
    btn.onclick = function () { 處理選擇組別點擊(str預備token, str組別); };
    elButtons.appendChild(btn);
  });
}

async function 處理選擇組別點擊(str預備token, str組別) {
  try {
    const objResult = await 呼叫組長API("組長選擇組別", { 預備token: str預備token, 組別: str組別 }, true);
    if (!objResult.成功) {
      window.alert(objResult.訊息 || "選擇組別失敗，請重新登入一次。");
      顯示登入畫面();
      return;
    }
    儲存登入組長資訊(objResult.token, objResult.組別, objResult.組長姓名);
    await 顯示表單畫面();
  } catch (錯誤) {
    console.error("選擇組別時發生未預期錯誤：", 錯誤);
    window.alert("系統發生未預期錯誤，請稍後再試或聯絡工程人員。");
  }
}

function 顯示登入畫面() {
  清除登入組長資訊();
  document.getElementById("loginArea").style.display = "block";
  document.getElementById("groupSelectArea").style.display = "none";
  document.getElementById("formArea").style.display = "none";
}

function 處理登出按鈕點擊() {
  顯示登入畫面();
}


// ==================== 【活動選擇與出席名單】 ====================

var arr目前出席名單 = [];
var bool目前活動已截止 = false;

/** 版本 v1.0：載入活動下拉選單 */
async function 載入活動下拉選單() {
  const elSelect = document.getElementById("selectActivity");
  try {
    const objResult = await 呼叫組長API("組長查詢出席活動清單");
    if (!objResult.成功) {
      顯示區塊訊息("msgForm", objResult.訊息 || "載入活動清單失敗。", "error");
      return;
    }
    const arr活動清單 = objResult.活動清單 || [];
    elSelect.innerHTML = "<option value=''>請選擇活動...</option>" +
      arr活動清單.map(function (obj一筆) {
        return "<option value='" + 轉義HTML(obj一筆.活動名稱) + "'>" + 轉義HTML(obj一筆.活動名稱) + (obj一筆.截止回報 ? "（已截止）" : "") + "</option>";
      }).join("");
    if (arr活動清單.length === 0) {
      document.getElementById("attendanceContentArea").innerHTML = "<div class='empty-hint'>資料組目前尚未建立任何出席回報活動，請稍後再回來查看。</div>";
    }
  } catch (錯誤) {
    console.error("載入活動下拉選單時發生錯誤：", 錯誤);
    顯示區塊訊息("msgForm", "系統發生未預期錯誤，請稍後再試或聯絡工程人員。", "error");
  }
}

async function 處理活動選擇變更() {
  const str活動名稱 = document.getElementById("selectActivity").value;
  const elArea = document.getElementById("attendanceContentArea");
  if (!str活動名稱) {
    elArea.innerHTML = "<div class='empty-hint'>請先選擇活動。</div>";
    return;
  }

  elArea.innerHTML = "<div class='empty-hint'>載入中，請稍候...</div>";
  顯示區塊訊息("msgForm", "", "info");

  try {
    const objResult = await 呼叫組長API("組長查詢出席名單", { 活動名稱: str活動名稱 });
    if (!objResult.成功) {
      elArea.innerHTML = "<div class='empty-hint'>載入失敗：" + 轉義HTML(objResult.訊息 || "未知錯誤") + "</div>";
      return;
    }

    arr目前出席名單 = objResult.名單 || [];
    bool目前活動已截止 = !!objResult.截止回報;

    const obj登入資訊 = 取得目前登入組長資訊();
    var strHTML = "";
    if (bool目前活動已截止) {
      strHTML += "<div class='closed-banner'>本活動的出席回報已截止，目前僅供檢視，如需異動請直接聯絡資料組協助處理。</div>";
    }

    if (arr目前出席名單.length === 0) {
      strHTML += "<div class='empty-hint'>本活動的核定名單中沒有貴組（" + 轉義HTML(obj登入資訊.組別) + "）的資料。</div>";
      elArea.innerHTML = strHTML;
      return;
    }

    strHTML += "<table><thead><tr>" +
      "<th>學員編號</th><th>姓名</th><th>法名</th><th>性別</th><th>職稱</th><th>出席</th><th>備註</th>" +
      "</tr></thead><tbody>";

    arr目前出席名單.forEach(function (obj一筆, int索引) {
      var bool本組負責 = obj一筆.負責組別 === obj登入資訊.組別;
      if (!bool本組負責) {
        strHTML += "<tr>" +
          "<td>" + 轉義HTML(obj一筆.學員編號) + "</td>" +
          "<td>" + 轉義HTML(obj一筆.姓名) + "</td>" +
          "<td>" + 轉義HTML(obj一筆.法名) + "</td>" +
          "<td>" + 轉義HTML(obj一筆.性別) + "</td>" +
          "<td>" + 轉義HTML(obj一筆.職稱) + "</td>" +
          "<td colspan='2' class='readonly-note'>已由" + 轉義HTML(obj一筆.負責組別) + "組聯絡確認</td>" +
          "</tr>";
        return;
      }

      var bool鎖定 = bool目前活動已截止;
      strHTML += "<tr data-row-index='" + int索引 + "'>" +
        "<td>" + 轉義HTML(obj一筆.學員編號) + "</td>" +
        "<td>" + 轉義HTML(obj一筆.姓名) + "</td>" +
        "<td>" + 轉義HTML(obj一筆.法名) + "</td>" +
        "<td>" + 轉義HTML(obj一筆.性別) + "</td>" +
        "<td>" + 轉義HTML(obj一筆.職稱) + "</td>" +
        "<td style='text-align:center;'><input type='checkbox' id='attend_" + int索引 + "'" + (obj一筆.出席 ? " checked" : "") + (bool鎖定 ? " disabled" : "") + "></td>" +
        "<td><input type='text' id='note_" + int索引 + "' value='" + 轉義HTML(obj一筆.備註) + "'" + (bool鎖定 ? " disabled" : "") + "></td>" +
        "</tr>";
    });

    strHTML += "</tbody></table>";

    if (!bool目前活動已截止) {
      strHTML += "<div class='btn-row'><button class='action' id='btnSubmitAttendance' onclick='處理送出出席回報按鈕點擊()'>送出出席回報</button></div>";
    }

    elArea.innerHTML = strHTML;
  } catch (錯誤) {
    console.error("載入出席名單時發生未預期錯誤：", 錯誤);
    elArea.innerHTML = "<div class='empty-hint'>載入時發生未預期錯誤，請重新整理頁面再試一次。</div>";
  }
}

async function 處理送出出席回報按鈕點擊() {
  const obj登入資訊 = 取得目前登入組長資訊();
  const str活動名稱 = document.getElementById("selectActivity").value;

  var arr送出資料 = [];
  arr目前出席名單.forEach(function (obj一筆, int索引) {
    if (obj一筆.負責組別 !== obj登入資訊.組別) { return; } // 不是本組負責的列，畫面上沒有輸入框可收集
    var elAttend = document.getElementById("attend_" + int索引);
    var elNote = document.getElementById("note_" + int索引);
    if (!elAttend) { return; }
    arr送出資料.push({
      學員編號: obj一筆.學員編號,
      出席: elAttend.checked,
      備註: elNote ? elNote.value.trim() : ""
    });
  });

  const btn = document.getElementById("btnSubmitAttendance");
  if (btn) { btn.disabled = true; }
  顯示區塊訊息("msgForm", "送出中，請稍候...", "info");

  try {
    const objResult = await 呼叫組長API("組長送出出席回報", { 活動名稱: str活動名稱, 名單: arr送出資料 });
    顯示區塊訊息("msgForm", objResult.訊息 || (objResult.成功 ? "送出成功。" : "送出失敗。"), objResult.成功 ? "success" : "error");
    if (objResult.成功) {
      await 處理活動選擇變更();
    }
  } catch (錯誤) {
    console.error("送出出席回報時發生未預期錯誤：", 錯誤);
    顯示區塊訊息("msgForm", "系統發生未預期錯誤，請稍後再試或聯絡工程人員。", "error");
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

async function 顯示表單畫面() {
  document.getElementById("loginArea").style.display = "none";
  document.getElementById("groupSelectArea").style.display = "none";
  document.getElementById("formArea").style.display = "block";

  const obj登入資訊 = 取得目前登入組長資訊();
  document.getElementById("groupNameShow").textContent = obj登入資訊.組別;
  document.getElementById("leaderNameShow").textContent = obj登入資訊.組長姓名;

  await 載入活動下拉選單();
}


// ==================== 【頁面初始化】 ====================

(async function 初始化頁面() {
  const obj登入資訊 = 取得目前登入組長資訊();
  if (obj登入資訊) {
    await 顯示表單畫面();
  } else {
    初始化Google登入();
  }
})();

</script>

</body>
</html>
