<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>護法會雲端系統 - 精舍登入</title>
<style>
  /*
   * ============================================================
   * 檔案：精舍選擇＋登入頁面
   * 版本：v1.2（2026-09-26）
   * 版本歷程：
   *   - v1.2（2026-09-26，法師訪談決議：登入後主畫面可由精舍自行
   *     設定）：v1.1 把導向頁面寫死改成「提報名單資料組操作」後，
   *     法師進一步提出：目前是「一精舍一組帳密」共用登入、並非個別
   *     使用者登入，比較適合做成「精舍在後台設定一次、全體套用」的
   *     方式，而非寫死同一個頁面給所有精舍。本次調整：
   *     (1) 登入成功時，把後端 精舍登入() 回傳的「登入後預設頁面」
   *     一併存入 sessionStorage（呼叫 儲存登入精舍資訊() 新增的第 4
   *     個參數），並改用共用函式 取得登入後導向網址() 依這個值決定
   *     要導向 report-admin.html 還是 temple-admin.html，不再寫死。
   *     (2) 已登入狀態下重新開啟本頁的自動導向邏輯，同樣改用
   *     取得目前登入精舍資訊() 讀回的「登入後預設頁面」+
   *     取得登入後導向網址() 判斷，與登入成功時的邏輯一致。
   *     (3) 精舍可在「精舍後台管理」的「修改精舍密碼」分頁自行切換
   *     這個設定；2026-09-26 之前已存在的舊精舍已透過後端一次性
   *     遷移補上 "report"，行為與 v1.1 完全相同，不會有感知得到的
   *     變化，只有新精舍預設值不同（"admin"，理由見後端版本說明）。
   *   - v1.1（2026-09-26，法師訪談決議：「提報名單資料組操作」是
   *     資料組平時最常用的主功能，「精舍後台管理」「報到場次管理」
   *     只是初期設定、偶爾才會用到）：登入成功、以及已登入狀態下
   *     重新開啟本頁時，導向頁面從「精舍後台管理」（temple-admin.html）
   *     改成「提報名單資料組操作」（report-admin.html），減少每次
   *     登入都要多點一次連結才能進到常用功能的麻煩；report-admin.html
   *     頁面上方仍保留「回精舍後台管理」按鈕，偶爾需要改密碼／設定
   *     試算表ID／封存下一期時，隨時可以回去。
   *   - v1.0（2026-09-16）：初版。提報系統、報到系統共用的登入
   *     入口。使用者直接輸入自己精舍的精舍代碼與密碼，登入成功後
   *     導向「精舍後台管理」頁面。
   * ============================================================
   */
  body {
    font-family: "微軟正黑體", "PMingLiU", sans-serif;
    background: #f4f6f9;
    color: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .box {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    padding: 32px 36px;
    width: 360px;
    max-width: 90vw;
  }
  h1 {
    font-size: 20px;
    color: #1F3864;
    margin: 0 0 6px 0;
    text-align: center;
  }
  .sub {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-weight: bold;
    margin: 14px 0 6px 0;
    font-size: 14px;
  }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 8px 10px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 10px;
    background: #2E5395;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled {
    background: #99a8c2;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    background: #1F3864;
  }
  #msg {
    margin-top: 14px;
    font-size: 13px;
    min-height: 18px;
    text-align: center;
  }
  #msg.error { color: #c00; }
  #msg.info { color: #666; }
</style>
</head>
<body>

<div class="box">
  <h1>護法會雲端系統</h1>
  <div class="sub">請輸入貴精舍代碼與密碼登入</div>

  <label for="inputTempleCode">精舍代碼</label>
  <input type="text" id="inputTempleCode" autocomplete="off" placeholder="例如：TEST">

  <label for="inputPassword">密碼</label>
  <input type="password" id="inputPassword" placeholder="請輸入密碼（新精舍預設密碼為 1234）">

  <button id="btnLogin" onclick="處理登入按鈕點擊()">登入</button>

  <div id="msg"></div>
</div>

<script src="config.js"></script>
<script>

/**
 * ------------------------------------------------------------
 * 函式：顯示訊息
 * 版本：v1.0（2026-09-16）
 * 用途：統一在畫面上顯示提示或錯誤訊息，避免每個地方都重寫一次
 *       操作 DOM 的程式碼。
 * 參數：
 *   str訊息內容 - 要顯示的文字
 *   bool是否為錯誤 - true 顯示紅色錯誤樣式，false 顯示灰色提示樣式
 * 回傳：無
 * ------------------------------------------------------------
 */
function 顯示訊息(str訊息內容, bool是否為錯誤) {
  const elMsg = document.getElementById("msg");
  elMsg.textContent = str訊息內容;
  elMsg.className = bool是否為錯誤 ? "error" : "info";
}

/**
 * ------------------------------------------------------------
 * 函式：處理登入按鈕點擊
 * 版本：v1.0（2026-09-16）
 * 用途：讀取畫面上輸入的精舍代碼與密碼，呼叫後端 API 進行登入；
 *       登入成功後把 token 存到 sessionStorage，並導向精舍後台
 *       管理頁面。
 * 參數：無（直接從畫面欄位讀取）
 * 回傳：無
 * ------------------------------------------------------------
 */
async function 處理登入按鈕點擊() {
  const str精舍代碼 = document.getElementById("inputTempleCode").value.trim();
  const str密碼 = document.getElementById("inputPassword").value;
  const btn登入按鈕 = document.getElementById("btnLogin");

  // 基本欄位檢查：避免空白直接送出，浪費一次網路請求
  if (!str精舍代碼) {
    顯示訊息("請輸入精舍代碼。", true);
    return;
  }
  if (!str密碼) {
    顯示訊息("請輸入密碼。", true);
    return;
  }

  // 送出期間先鎖住按鈕，避免使用者重複點擊造成重複請求
  btn登入按鈕.disabled = true;
  顯示訊息("登入中，請稍候...", false);

  try {
    const objResult = await 呼叫後端API({
      system: "temple",
      action: "精舍登入",
      精舍代碼: str精舍代碼,
      密碼: str密碼
    });

    if (objResult.成功) {
      // 登入成功：把登入資訊（含「登入後預設頁面」）存起來，依精舍自己的設定
      // 導向對應頁面（2026-09-26 法師訪談決議：一精舍一組帳密共用登入，讓
      // 精舍在後台自行設定要進「提報名單資料組操作」還是「精舍後台管理」，
      // 不再由前端寫死同一個頁面給所有精舍）
      儲存登入精舍資訊(objResult.token, str精舍代碼, objResult.精舍顯示名稱 || str精舍代碼, objResult.登入後預設頁面);
      顯示訊息("登入成功，正在跳轉...", false);
      window.location.href = 取得登入後導向網址(objResult.登入後預設頁面);
    } else {
      // 登入失敗：常見原因是精舍代碼不存在或密碼錯誤，後端訊息已經是中文說明
      顯示訊息(objResult.訊息 || "登入失敗，請確認精舍代碼與密碼是否正確。", true);
    }
  } catch (錯誤) {
    console.error("登入過程發生未預期錯誤：", 錯誤);
    顯示訊息("系統發生未預期錯誤，請稍後再試或聯絡工程人員。", true);
  } finally {
    btn登入按鈕.disabled = false;
  }
}

// 讓使用者在密碼欄位按 Enter 鍵也能直接登入，不用一定要用滑鼠點按鈕
document.getElementById("inputPassword").addEventListener("keyup", function (event) {
  if (event.key === "Enter") {
    處理登入按鈕點擊();
  }
});

// 如果使用者已經是登入狀態（sessionStorage 裡還有 token），直接依精舍自己
// 設定的「登入後預設頁面」導向對應頁面，不用再登入一次（2026-09-26 法師
// 訪談決議，理由同上方登入成功後的導向邏輯）
(function 檢查是否已登入() {
  const obj已登入資訊 = 取得目前登入精舍資訊();
  if (obj已登入資訊) {
    window.location.href = 取得登入後導向網址(obj已登入資訊.登入後預設頁面);
  }
})();

</script>

</body>
</html>
